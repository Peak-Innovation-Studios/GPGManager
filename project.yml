name: GPGManager
options:
  bundleIdPrefix: com.dpeak
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages: {}
targets:
  GPGManager:
    type: application
    platform: macOS
    sources:
      - path: GPGManager
    info:
      path: GPGManager/Resources/Info.plist
      properties:
        CFBundleDisplayName: GPG Manager
        CFBundleName: GPG Manager
        CFBundleIdentifier: com.dpeak.GPGManager
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026"
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dpeak.GPGManager
        PRODUCT_NAME: GPGManager
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GPGManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GPGManagerTests
    dependencies:
      - target: GPGManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dpeak.GPGManagerTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
schemes:
  GPGManager:
    build:
      targets:
        GPGManager: all
        GPGManagerTests: [test]
    test:
      targets:
        - GPGManagerTests
