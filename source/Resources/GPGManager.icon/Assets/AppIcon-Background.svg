<?xml version="1.0" encoding="UTF-8"?>
<!--
  GPG Manager — app icon · LAYER 1: background
  Import this as the bottom (background) layer in Icon Composer.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024">
  <defs>
    <linearGradient id="background-gradient" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"  stop-color="#3A4B7C"/>
      <stop offset="100%" stop-color="#15224A"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#background-gradient)"/>
</svg>
