<?xml version="1.0" encoding="UTF-8"?>
<!--
  DMG background for GPGManager.
  Window size: 660x400 pt. Icons placed by appdmg:
    - GPGManager.app at (165, 200)
    - Applications link at (495, 200)

  Background uses the previous arrow colors; arrow uses the first
  GPGManager DMG background palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fb3a8"/>
      <stop offset="58%" stop-color="#95cec8"/>
      <stop offset="100%" stop-color="#d4e0ea"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#234B3E"/>
      <stop offset="52%" stop-color="#4F8467"/>
      <stop offset="100%" stop-color="#D7E8DC"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="25%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ecf1f6" stop-opacity="0.24"/>
      <stop offset="56%" stop-color="#ecf1f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ecf1f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="660" height="400" fill="url(#background)"/>
  <rect width="660" height="400" fill="url(#accentGlow)"/>

  <g transform="translate(330, 200)" stroke="url(#arrow)" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="-88" y1="0" x2="88" y2="0"/>
    <path d="M 82 -8 L 96 0 L 82 8"/>
  </g>
</svg>
