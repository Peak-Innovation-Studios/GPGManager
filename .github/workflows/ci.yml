name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: GPGManager.xcodeproj
  SCHEME: GPGManager
  DESTINATION: platform=macOS
  XCODE_VERSION: "26.4.1"

jobs:
  test:
    name: Build + Test
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          else
            echo "Requested $XCODE_PATH not found; using runner default."
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -resolvePackageDependencies

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          mkdir -p build/reports
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            -resultBundlePath build/reports/GPGManager.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Generate test report
        if: always()
        run: |
          if [ -d build/reports/GPGManager.xcresult ]; then
            python3 scripts/github-test-report.py \
              --xcresult build/reports/GPGManager.xcresult \
              --out-dir build/reports
            cat build/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No xcresult bundle found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gpgmanager-test-report
          path: |
            build/reports/GPGManager.xcresult
            build/reports/summary.json
            build/reports/tests.json
            build/reports/summary.md
            build/reports/junit.xml
          retention-days: 14
