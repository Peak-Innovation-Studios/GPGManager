name: Release

# Manual-only fallback release channel. Xcode Cloud is the primary channel and
# builds on v* tag pushes; run this workflow by hand only when Xcode Cloud has
# issues, so the two channels never race on the appcast / GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.0.1. Leave empty to use the project setting."
        required: false
        type: string
      build_number:
        description: "Build number. Leave empty to derive max(appcast sparkle:version) + 1."
        required: false
        type: string
      publish:
        description: "Upload to R2 and publish/update the GitHub Release."
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  XCODE_VERSION: "26.4.1"
  TEAM_ID: Z2R2L2TJ7Y
  APPCAST_PUBLIC_URL: https://updates.peakinnovationstudios.com/gpg-manager

jobs:
  release:
    name: Notarize + Publish DMG
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          else
            echo "Requested $XCODE_PATH not found; using runner default."
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild -project GPGManager.xcodeproj \
            -scheme GPGManager \
            -resolvePackageDependencies

      - name: Build, notarize, and publish
        env:
          VERSION: ${{ inputs.version }}
          # Empty unless explicitly provided; github-release.sh then derives a
          # monotonic build number from the appcast (max sparkle:version + 1).
          BUILD_NUMBER: ${{ inputs.build_number }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          GITHUB_TOKEN: ${{ github.token }}
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          DEVELOPER_ID_PROFILE_APP_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_APP_BASE64 }}
          DEVELOPER_ID_PROFILE_PINENTRY_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_PINENTRY_BASE64 }}
          DEVELOPER_ID_CERT_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_P12_PASSWORD }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT_URL }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: scripts/github-release.sh

      - name: Upload DMG artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gpgmanager-dmg
          path: ${{ runner.temp }}/dmg/*.dmg
          if-no-files-found: ignore
          retention-days: 30
